<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Project on Development — Moon.Rin</title>
  <link rel="stylesheet" href="Coba-coba.html" />
  <style>
    /* ═══════════════════════════════════════════════════════════
       CSS VARIABLES — Edit warna & font utama di sini
    ═══════════════════════════════════════════════════════════ */
    :root {
      --color-bg:          #0a0a0a;       /* background utama */
      --color-surface:     #111111;       /* background card/section */
      --color-border:      #222222;       /* warna garis border */
      --color-text:        #f0ece4;       /* teks utama */
      --color-muted:       #6b6b6b;       /* teks sekunder/muted */
      --color-accent:      #c8f04e;       /* warna aksen (hijau neon) */
      --color-accent-dim:  #1a2200;       /* aksen redup untuk bg badge */

      --font-display:      'Bebas Neue', sans-serif;   /* font judul besar */
      --font-body:         'DM Sans', sans-serif;       /* font teks biasa */

      --radius:            10px;
      --radius-lg:         18px;
      --transition:        0.2s ease;
      --max-w:             1100px;
    }

    /* ═══════════════════════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: 15px;
      line-height: 1.7;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ul { list-style: none; }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ═══════════════════════════════════════════════════════════
       NAVIGATION
    ═══════════════════════════════════════════════════════════ */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
    }

    /* ── Logo / Inisial ── */
    .nav-logo {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 0.05em;
      color: var(--color-accent);
    }

    /* ── Menu Links ── */
    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted);
      transition: color var(--transition);
    }

    .nav-links a:hover { color: var(--color-text); }

    /* ── Hire Me Button ── */
    .nav-cta {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 20px;
      border: 1px solid var(--color-accent);
      border-radius: 40px;
      color: var(--color-accent);
      transition: all var(--transition);
    }

    .nav-cta:hover {
      background: var(--color-accent);
      color: #000;
    }

    /* ═══════════════════════════════════════════════════════════
       HERO SECTION
    ═══════════════════════════════════════════════════════════ */
    #hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 40px 60px;
      padding-top: 0;
      position: relative;
      overflow: hidden;
    }

    /* ── Dekoratif grid background ── */
    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--color-border) 1px, transparent 1px),
        linear-gradient(90deg, var(--color-border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.1;
    }

    #hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 300px;
      background: linear-gradient(transparent, var(--color-bg));
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 40px;
      background: var(--color-accent-dim);
      border: 1px solid var(--color-accent);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    /* ── Titik animasi status ── */
    .hero-badge::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    /* ── Nama besar ── */
    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(72px, 12vw, 160px);
      line-height: 0.9;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .hero-name span { color: var(--color-accent); }

    .hero-bottom {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      position: relative;
      z-index: 1;
      margin-top: 0px;
    }

    .hero-desc {
      max-width: 420px;
      color: var(--color-text);
      font-size: 22px;
      line-height: 1.8;
      margin: 0;
    }

    .hero-meta {
      text-align: right;
      font-size: 12px;
      color: var(--color-muted);
      line-height: 2;
    }

    .hero-photo {
      position :absolute;
      right: 0px;
      top: 85px;
      height: 100%;
      width: 40%;
      object-fit: cover;
      object-position: top;
      opacity: 0.38;
      z-index: 0;
      pointer-events: none;-webkit-mask-image: linear-gradient(
      to left,
       rgba(0,0,0,1) 20%,
       rgba(0,0,0,0) 100%
      ),
      linear-gradient(
      to top,
       rgba(0,0,0,0) 0%,
       rgba(0,0,0,1) 20%
      );
    -webkit-mask-composite: source-in;
     mask-image: linear-gradient(
      to left,
       rgba(0,0,0,1) 40%,
       rgba(0,0,0,0) 100%
     ),
     linear-gradient(
       to top,
       rgba(0,0,0,0) 0%,
       rgba(0,0,0,1) 20%
     );
     mask-composite: intersect;
    }

    .hero-meta strong { color: var(--color-text); font-weight: 500; }

    /* ── Scroll indicator ── */
    .scroll-hint {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 40px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      position: relative;
      z-index: 1;
    }

    .scroll-hint::before {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--color-muted);
    }

    /* ── Tags kepribadian ── */
    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .hero-tag {
      font-size: 12px;
      padding: 4px 12px;
      border: 1px solid var(--color-border);
      border-radius: 40px;
      color: var(--color-muted);
    }

    /* ═══════════════════════════════════════════════════════════
       SECTION SHARED STYLES
    ═══════════════════════════════════════════════════════════ */
    section {
      padding: 100px 0;
      border-top: 1px solid var(--color-border);
    }

    .section-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 64px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 12px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(42px, 6vw, 80px);
      line-height: 1;
      letter-spacing: 0.02em;
    }

    /* ═══════════════════════════════════════════════════════════
       ABOUT SECTION
    ═══════════════════════════════════════════════════════════ */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }

    .about-text p {
      color: var(--color-muted);
      line-height: 1.9;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .about-text p:last-child { margin-bottom: 0; }

    .about-cta {
      display: flex;
      gap: 12px;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: all var(--transition);
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #000;
    }

    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text);
    }

    .btn-ghost:hover {
      border-color: var(--color-text);
      transform: translateY(-1px);
    }

    .about-meta {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .meta-item {
      padding: 20px 24px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
    }

    .meta-item-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-muted);
      margin-bottom: 6px;
    }

    .meta-item-value {
      font-size: 14px;
      font-weight: 500;
    }

    /* ── Quote besar ── */
    .about-quote {
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1.3;
      letter-spacing: 0.02em;
      color: var(--color-text);
      padding: 28px 0;
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 24px;
    }

    .about-quote span { color: var(--color-accent); }

    /* ═══════════════════════════════════════════════════════════
       SKILLS SECTION
    ═══════════════════════════════════════════════════════════ */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .skill-list { display: flex; flex-direction: column; gap: 20px; }

    .skill-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .skill-name { font-size: 13px; font-weight: 500; }
    .skill-pct  { font-size: 13px; color: var(--color-accent); font-weight: 500; }

    .skill-track {
      height: 3px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
    }

    .skill-fill {
      height: 100%;
      background: var(--color-accent);
      border-radius: 2px;
      transition: width 1s ease;
    }

    /* ── Soft Skills + Tools ── */
    .soft-skills-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 36px;
    }

    .soft-skill-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--color-muted);
      padding: 10px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .soft-skill-item::before {
      content: '→';
      color: var(--color-accent);
      font-weight: 600;
    }

    .tools-wrap { margin-top: 8px; }

    .tools-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-muted);
      margin-bottom: 14px;
    }

    .tools-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tool-tag {
      font-size: 12px;
      padding: 5px 13px;
      border: 1px solid var(--color-border);
      border-radius: 40px;
      color: var(--color-muted);
    }

    /* ═══════════════════════════════════════════════════════════
       PROJECTS SECTION
    ═══════════════════════════════════════════════════════════ */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .project-card {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-surface);
      transition: border-color var(--transition), transform var(--transition);
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      border-color: var(--color-accent);
      transform: translateY(-4px);
    }

    /* ── Gambar proyek — ganti src dengan path gambar kamu ── */
    .project-img {
      aspect-ratio: 16/10;
      background: var(--color-border);
      overflow: hidden;
    }

    .project-img {
      position: relative;
    }

    .project-img-overlay {
      position: absolute;
      bottom: 5px;
      left: 5px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 80%;
    }
    
    .project-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .project-card:hover .project-img img { transform: scale(1.04); }

    .project-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

    .project-type {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 8px;
    }

    .project-name {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 0.03em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .project-desc {
      font-size: 13px;
      color: var(--color-muted);
      line-height: 1.6;
      flex: 1;
      margin-bottom: 16px;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .project-tag {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 40px;
      background: var(--color-accent-dim);
      color: var(--color-accent);
      font-weight: 500;
    }

    .project-link {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap var(--transition);
    }

    .project-card:hover .project-link { gap: 10px; color: var(--color-accent); }

    /* ═══════════════════════════════════════════════════════════
       EXPERIENCE SECTION
    ═══════════════════════════════════════════════════════════ */
    .exp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
    }

    .exp-col-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 32px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
    }

    .exp-list { display: flex; flex-direction: column; }

    .exp-item {
      display: flex;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid var(--color-border);
      position: relative;
    }

    .exp-item:last-child { border-bottom: none; }

    .exp-dot-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 5px;
    }

    .exp-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--color-accent);
      background: transparent;
      flex-shrink: 0;
    }

    .exp-line {
      width: 1px;
      flex: 1;
      background: var(--color-border);
      margin-top: 6px;
    }

    .exp-item:last-child .exp-line { display: none; }

    .exp-content { flex: 1; }

    .exp-period {
      font-size: 11px;
      color: var(--color-muted);
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .exp-role {
      font-family: var(--font-display);
      font-size: 20px;
      letter-spacing: 0.03em;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .exp-org {
      font-size: 12px;
      color: var(--color-accent);
      margin-bottom: 10px;
    }

    .exp-desc {
      font-size: 13px;
      color: var(--color-muted);
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .exp-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .exp-chip {
      font-size: 11px;
      padding: 3px 9px;
      border: 1px solid var(--color-border);
      border-radius: 40px;
      color: var(--color-muted);
    }

    /* ── Education card ── */
    .edu-card {
      padding: 24px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      margin-bottom: 20px;
    }

    .edu-degree { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.03em; margin-bottom: 4px; }
    .edu-school { font-size: 13px; color: var(--color-muted); margin-bottom: 4px; }
    .edu-period { font-size: 12px; color: var(--color-muted); }

    .edu-courses {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .edu-course {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 40px;
      background: var(--color-accent-dim);
      color: var(--color-accent);
    }

    .edu-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      position: absolute  ;
      top: 1px;
      right: 20px;
    }

    .edu-card {
       position: relative;
    }

    /* ═══════════════════════════════════════════════════════════
       CONTACT SECTION
    ═══════════════════════════════════════════════════════════ */
    .contact-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }

    .contact-headline {
      font-family: var(--font-display);
      font-size: clamp(42px, 5vw, 70px);
      line-height: 1;
      letter-spacing: 0.02em;
      margin-bottom: 24px;
    }

    .contact-headline span { color: var(--color-accent); }

    .contact-subtext {
      color: var(--color-muted);
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 36px;
      max-width: 380px;
    }

    .contact-links { display: flex; flex-direction: column; gap: 14px; }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      transition: border-color var(--transition), transform var(--transition);
    }

    .contact-link:hover {
      border-color: var(--color-accent);
      transform: translateX(4px);
    }

    .contact-link-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--color-accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .contact-link-meta { flex: 1; }
    .contact-link-label { font-size: 11px; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
    .contact-link-value { font-size: 13px; font-weight: 500; }

    .contact-link-arrow {
      color: var(--color-muted);
      font-size: 16px;
      transition: color var(--transition);
    }

    .contact-link:hover .contact-link-arrow { color: var(--color-accent); }

    /* ── Form kontak ── */
    .contact-form { display: flex; flex-direction: column; gap: 16px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }

    .form-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    .form-input,
    .form-textarea {
      padding: 12px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color var(--transition);
      width: 100%;
    }

    .form-input:focus,
    .form-textarea:focus { border-color: var(--color-accent); }

    .form-textarea { min-height: 140px; resize: vertical; }

    .form-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--color-accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
      align-self: flex-start;
    }

    .form-btn:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ── Lokasi info ── */
    .location-card {
      padding: 20px 24px;
